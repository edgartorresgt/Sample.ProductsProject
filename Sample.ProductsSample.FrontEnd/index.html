<!DOCTYPE html>
<html>
<head>
  <title>Products</title>
  <style>
    table { border-collapse: collapse; width: 50%; }
    th, td { border: 1px solid #ddd; padding: 8px; }
  </style>
</head>
<body>
  <h1>Product List</h1>
  <table id="productTable">
    <thead>
      <tr><th>ID</th><th>Name</th><th>Description</th><th>Price</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    fetch("https://localhost:7191/api/products", {
      headers: { "X-API-KEY": "12345" }
    })
    .then(res => {
      if (!res.ok) throw new Error("Unauthorized or API error");
      return res.json();
    })
    .then(data => {
      const tbody = document.querySelector("#productTable tbody");
      data.forEach(p => {
        tbody.innerHTML += `<tr><td>${p.id}</td><td>${p.name}</td><td>${p.description}</td><td>${p.price}</td></tr>`;
      });
    })
    .catch(err => alert(err.message));
  </script>
</body>
</html>
